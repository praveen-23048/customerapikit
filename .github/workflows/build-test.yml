name: MuleSoft Build and MUnit Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Install and Configure Maven 3.8.8 Natively
      run: |
        wget https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz
        tar -xzf apache-maven-3.8.8-bin.tar.gz
        sudo mv apache-maven-3.8.8 /opt/maven
        echo "/opt/maven/bin" >> $GITHUB_PATH

    - name: Verify Maven Version
      run: mvn -version

    - name: Run Build and MUnit Tests
      run: mvn clean test -B -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true