name: MuleSoft Build and MUnit Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Set up Maven 3.8.8
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.8.8

    - name: Run Build and MUnit Tests
      run: mvn clean test -B